
services:
  serenade-db:
    image: postgres:16
    restart: unless-stopped
    container_name: postgres-16
    volumes:
      - postgres_data:/home/inscriptions/db/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=events
      - POSTGRES_PASSWORD=postgres
    networks:
      - events-net

volumes:
  postgres_data:

networks:
  events-net:
    name: events-network
