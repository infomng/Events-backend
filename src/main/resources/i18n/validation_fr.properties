# Messages de Validation - Français

# Validation de Champ
field.required=Ce champ est requis
field.invalid=Ce champ est invalide
field.email=Veuillez entrer une adresse email valide
field.phone=Veuillez entrer un numéro de téléphone valide
field.url=Veuillez entrer une URL valide
field.numeric=Ce champ doit être numérique
field.positive=Ce champ doit être un nombre positif
field.negative=Ce champ doit être un nombre négatif
field.min=La valeur minimale est {0}
field.max=La valeur maximale est {0}
field.size=La taille doit être entre {0} et {1}
field.pattern=Ce champ ne correspond pas au format requis

# Validation d'Entité
entity.not.found={0} introuvable
entity.already.exists={0} existe déjà
entity.cannot.delete={0} ne peut pas être supprimé
entity.cannot.update={0} ne peut pas être mis à jour
entity.in.use={0} est actuellement utilisé

# Validation de Date
date.required=La date est requise
date.invalid=Format de date invalide
date.past=La date doit être dans le passé
date.future=La date doit être dans le futur
date.range=La date doit être entre {0} et {1}
date.before=La date doit être avant {0}
date.after=La date doit être après {0}

# Validation de Fichier
file.required=Le fichier est requis
file.too.large=La taille du fichier dépasse la limite maximale de {0}
file.invalid.type=Type de fichier invalide. Types autorisés: {0}
file.upload.failed=Le téléchargement du fichier a échoué
file.not.found=Fichier introuvable

# Validation de Mot de Passe
password.required=Le mot de passe est requis
password.too.short=Le mot de passe doit contenir au moins {0} caractères
password.too.weak=Le mot de passe doit contenir des majuscules, minuscules, chiffres et caractères spéciaux
password.mismatch=Les mots de passe ne correspondent pas
